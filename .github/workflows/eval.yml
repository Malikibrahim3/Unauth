name: Engine Eval

on: [pull_request]

jobs:
  eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run engine eval
        id: eval
        env:
          IDENTITY_SALT: ${{ secrets.IDENTITY_SALT || 'ci-salt-000000000000000000000000000000000000' }}
          NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-anon-key
          SUPABASE_SERVICE_ROLE_KEY: ci-service-role-key
          NODE_ENV: test
          CI: 'true'
        run: npm run eval -- test-data/realistic_fraud_dataset.csv

      - name: Record F1 in job summary
        if: always()
        env:
          EVAL_OUTCOME: ${{ steps.eval.outcome }}
        run: |
          if [ "$EVAL_OUTCOME" = "success" ]; then
            {
              echo '## ✅ Engine Eval — PASS'
              echo
              echo 'F1 floor: 0.70'
              echo 'Engine eval passed. F1 ≥ 0.70.'
            } >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo '## ❌ Engine Eval — FAIL'
              echo
              echo 'F1 floor: 0.70'
              echo 'Engine eval failed. Check signal regressions before merging.'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
