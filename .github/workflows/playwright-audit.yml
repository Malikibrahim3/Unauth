name: Playwright Audit

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: playwright-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  critical:
    name: Critical and mobile staging audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: staging
    env:
      PLAYWRIGHT: '1'
      STAGING_BASE_URL: ${{ secrets.STAGING_BASE_URL }}
      STAGING_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
      STAGING_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.STAGING_SUPABASE_SERVICE_ROLE_KEY }}
      PLAYWRIGHT_BASE_URL: ${{ secrets.STAGING_BASE_URL }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.STAGING_SUPABASE_SERVICE_ROLE_KEY }}
      E2E_AUTH_SECRET: ${{ secrets.STAGING_E2E_AUTH_SECRET }}
      E2E_MERCHANT_ID: ${{ secrets.STAGING_E2E_MERCHANT_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run critical Playwright suite
        run: npm run test:critical

      - name: Run critical mobile path
        run: npx playwright test --config=tests/playwright.config.ts --project=mobile tests/current/current-product.spec.ts

      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-html-report
          path: tests/reports/html
          if-no-files-found: ignore
          retention-days: 14
