label: "PROVISIONAL — NOT CERTIFICATION EVIDENCE"
phase: P00
rows:
  - id: P00-E01
    requirement: Entry bootstrap and observed base are immutable and reproducible
    evidence: [spec-lock.yaml, observed-base-manifest.json]
    verification: spec hash and Git metadata inspection
  - id: P00-E02
    requirement: Commands, stack, packages, routes, APIs, UI, fixtures, flags and environments are inventoried
    evidence: [repository-map.md, routes.json, contract-gap.csv, ui-inventory.md, test-environment-baseline.md]
    verification: deterministic inventory generator plus repository inspection
  - id: P00-E03
    requirement: Governance registry covers P00-P14 and G00-G15 without invented identities
    evidence: [owners-approvals.yaml]
    verification: governance seat and mapping review
  - id: P00-E04
    requirement: Required architecture decisions are recorded
    evidence: [../adrs/P00-architecture-decisions.md]
    verification: ADR completeness review
  - id: P00-E05
    requirement: Frozen non-computing fixture covers every P01 surface/state and validates structurally
    evidence: [reference-fixture.schema.json, reference-fixture.normal.json]
    verification: tests/p00/referenceFixture.test.ts
  - id: P00-E06
    requirement: Performance manifest and non-certifying local baseline exist
    evidence: [performance-lab.yaml, test-environment-baseline.md]
    verification: local environment inspection; no G07 claim
  - id: P00-E07
    requirement: Minimal vertical slice proves contract, response, decode, boundary, focus, telemetry and regression
    evidence: [../../../lib/p00/generated/bootstrapContract.ts, ../../../lib/p00/bootstrapSlice.tsx, ../../../tests/p00/minimalVerticalSlice.test.tsx]
    verification: npm test -- --runInBand tests/p00
  - id: P00-E08
    requirement: Risks, decisions, blockers, capacity and sequencing are explicit
    evidence: [risks-decisions.md, blockers.yaml, capacity-sequencing.md]
    verification: exit-gate review
  - id: P00-E09
    requirement: One immutable acceptance candidate and hashed evidence pack
    evidence: [../evidence/P00/manifest.json, ../certificates/P00.yaml]
    verification: scripts/p00-generate-evidence.mjs and hash verification
