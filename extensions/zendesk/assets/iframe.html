<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Unauth</title>
  <script src="https://static.zdassets.com/zendesk_app_framework_sdk/2.0/zaf_sdk.min.js"></script>
  <style>
    @font-face {
      font-family: 'Unauth Inter';
      src: url('fonts/inter-latin-variable.woff2') format('woff2');
      font-style: normal;
      font-weight: 300 700;
      font-display: swap;
    }
    @font-face {
      font-family: 'Unauth DM Mono';
      src: url('fonts/dm-mono-latin-400.woff2') format('woff2');
      font-style: normal;
      font-weight: 400;
      font-display: swap;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Unauth Inter', Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 13px;
      line-height: 1.45;
      color: #18181b;
      background: #f7f7f8;
      padding: 12px;
      max-width: 300px;
    }
    .card {
      border-radius: 9px;
      border: 1px solid #e4e4e7;
      padding: 14px;
      background: #ffffff;
    }
    .headline {
      font-size: 14px;
      font-weight: 650;
      letter-spacing: -0.02em;
      margin-bottom: 4px;
    }
    .meta {
      font-size: 12px;
      opacity: 0.92;
      margin-bottom: 10px;
    }
    .section { margin-top: 10px; }
    .section-title {
      font-size: 12px;
      font-weight: 600;
      text-transform: none;
      letter-spacing: 0;
      opacity: 0.7;
      margin-bottom: 6px;
    }
    ul.signals { list-style: none; padding: 0; }
    ul.signals li {
      position: relative;
      padding-left: 12px;
      margin-bottom: 4px;
      font-size: 12px;
    }
    ul.signals li::before {
      content: '·';
      position: absolute;
      left: 0;
      opacity: 0.7;
    }
    .cross {
      font-size: 12px;
      padding: 8px;
      border-radius: 6px;
      background: rgba(91,91,214,0.08);
    }
    .actions {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-top: 12px;
    }
    .btn {
      display: block;
      text-align: center;
      padding: 8px 10px;
      border-radius: 7px;
      font-size: 12px;
      font-weight: 600;
      text-decoration: none;
      cursor: pointer;
      border: none;
      width: 100%;
      font-family: inherit;
    }
    .btn-primary { background: #5b5bd6; color: #fff; }
    .btn-primary:hover { background: #4949b8; }
    .btn-ghost {
      background: transparent;
      color: #52525b;
      border: 1px solid #d4d4d8;
    }
    .btn-ghost:disabled { opacity: 0.5; cursor: not-allowed; }
    .evidence-result {
      font-size: 12px;
      margin-top: 6px;
      overflow-wrap: anywhere;
      word-break: normal;
    }
    .evidence-result a { color: #5b5bd6; }
    .muted { color: #71717a; font-size: 12px; }
    .brand {
      margin-top: 10px;
      text-align: right;
    }
    .brand img {
      display: inline-block;
      width: 64px;
      height: auto;
    }
    .loading-card {
      background: #f1f1f3;
      border-color: #e4e4e7;
      animation: pulse 1.4s ease-in-out infinite;
    }
    .state-heading {
      display: flex;
      align-items: center;
      gap: 7px;
    }
    .state-dot {
      width: 7px;
      height: 7px;
      flex: 0 0 auto;
      border-radius: 50%;
      background: #71717a;
    }
    .state-definite { background: #237a4b; }
    .state-probable { background: #2563a6; }
    .state-possible { background: #8a6116; }
    .state-weak { background: #71717a; }
    .notice {
      margin-top: 8px;
      padding: 8px 10px;
      border: 1px solid #e4e4e7;
      border-radius: 7px;
      background: #f7f7f8;
      color: #52525b;
    }
    .notice-warning {
      border-color: #ead49b;
      background: #fff8e7;
      color: #704d12;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.65; }
    }
    #root { min-height: 80px; }
  </style>
</head>
<body>
  <div id="root"></div>
  <div class="brand"><img src="logo-small.png" alt="Unauth" /></div>
  <script>
    (function () {
      var APP_BASE = 'https://unauth-pi.vercel.app';
      var root = document.getElementById('root');

      function esc(s) {
        return String(s)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;');
      }

      // Identity confidence grade theming — reflects how certain we are about
      // WHO the person is, never how risky they are. A clean DEFINITE match is a
      // calm green confirmation, not a warning. No risk score, no risk band.
      function gradeTheme(grade) {
        if (grade === 'definite') {
          return { className: 'state-definite', label: 'Definite match' };
        }
        if (grade === 'probable') {
          return { className: 'state-probable', label: 'Probable match' };
        }
        if (grade === 'possible') {
          return { className: 'state-possible', label: 'Possible match' };
        }
        return { className: 'state-weak', label: 'Weak match' };
      }

      function formatClaimDate(iso) {
        if (!iso) return '';
        var d = new Date(iso);
        if (isNaN(d.getTime())) return '';
        return d.toLocaleDateString('en-US', { day: '2-digit', month: 'short', year: 'numeric' });
      }

      function claimsLine(claims) {
        if (!claims) return 'No prior claims on record';
        var refunds = Number(claims.refunds || 0);
        var chargebacks = Number(claims.chargebacks || 0);
        if (refunds + chargebacks === 0) return 'No prior claims on record';
        var src = claims.source === 'network' ? 'across network' : 'your store';
        var parts = [];
        if (refunds > 0) parts.push(refunds + ' ' + (refunds === 1 ? 'refund' : 'refunds'));
        if (chargebacks > 0) parts.push(chargebacks + ' ' + (chargebacks === 1 ? 'chargeback' : 'chargebacks'));
        if (claims.refund_value != null) parts.push('$' + Number(claims.refund_value).toLocaleString() + ' at your store');
        var date = formatClaimDate(claims.last_claim_at);
        if (date) parts.push('last ' + date);
        return parts.join(' · ') + ' — ' + src;
      }

      function profileUrl(email) {
        return APP_BASE + '/customers?email=' + encodeURIComponent(email);
      }

      async function fetchProfileUrl(apiKey, email) {
        var response = await fetch(APP_BASE + '/api/v1/profile-link', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            Accept: 'application/json',
            Authorization: 'Bearer ' + apiKey,
          },
          body: JSON.stringify({ email: email }),
        });
        var body = await response.json().catch(function () { return {}; });
        if (!response.ok) throw new Error((body && body.error) || 'Could not build profile link');
        return body.profile_url || profileUrl(email);
      }

      function settingsUrl() {
        return APP_BASE + '/sources/setup/zendesk';
      }

      function resolveAppBase(settings) {
        var raw = (settings && settings.app_base_url) || APP_BASE;
        return String(raw).replace(/\/$/, '');
      }

      function renderLoading() {
        root.innerHTML =
          '<div class="card loading-card" style="border:1px solid #e4e4e7;">' +
          '<p class="muted">Checking identity network…</p></div>';
      }

      function renderError(message) {
        root.innerHTML =
          '<div class="card">' +
          '<div class="headline">Connection error</div>' +
          '<div class="notice notice-warning"><p>' + esc(message || 'Could not reach Unauth') + '</p>' +
          '<p class="muted" style="margin-top:8px;">Check your API key</p>' +
          '</div>' +
          '<div class="actions">' +
          '<button type="button" class="btn btn-primary" id="unauth-settings-btn">Open Unauth Settings</button>' +
          '</div></div>';
        document.getElementById('unauth-settings-btn').addEventListener('click', function () {
          window.open(settingsUrl(), '_blank', 'noopener,noreferrer');
        });
      }

      function renderNotFound() {
        root.innerHTML =
          '<div class="card">' +
          '<div class="headline">No profile</div>' +
          '<div class="notice"><p>Not in Unauth network yet</p></div>' +
          '<div class="actions">' +
          '<button type="button" class="btn btn-primary" id="unauth-home-btn">Go to Unauth</button>' +
          '</div></div>';
        document.getElementById('unauth-home-btn').addEventListener('click', function () {
          window.open(APP_BASE, '_blank', 'noopener,noreferrer');
        });
      }

      function storeOrdersLine(store) {
        if (!store) return '';
        var orders = store.orders != null ? store.orders : '—';
        var claims = store.claims != null ? store.claims : 0;
        var parts = ['Orders at your store: ' + esc(String(orders))];
        if (claims > 0) {
          parts.push(claims + ' claim' + (claims === 1 ? '' : 's') + ' on record');
        }
        if (store.primary_reason) {
          parts.push('Top reason: ' + esc(store.primary_reason));
        }
        return '<div class="section"><p class="muted">' + parts.join(' · ') + '</p></div>';
      }

      function networkLine(network) {
        if (!network || !network.merchants) return '';
        return (
          '<div class="section cross"><p class="section-title">Network</p><p>' +
          esc(String(network.orders)) + ' orders · ' +
          esc(String(network.claims)) + ' claims · ' +
          esc(String(network.merchants)) + ' merchants</p></div>'
        );
      }

      function renderHelpdeskContext(ctx, apiKey, email, orderId) {
        var profileUrlValue =
          ctx.profile_url ||
          profileUrl(email);
        var theme = gradeTheme(ctx.confidence || 'definite');
        var storeHtml = storeOrdersLine(ctx.store);
        var networkHtml = networkLine(ctx.network);
        var claims = ctx.claims_record || {};
        var refunds = Number(claims.refunds || 0);
        var chargebacks = Number(claims.chargebacks || 0);
        var claimsHtml =
          refunds + chargebacks > 0
            ? '<div class="section"><p class="section-title">Claims on record</p><p>' +
              esc(claimsLine(claims)) +
              '</p></div>'
            : '';
        var matchedHtml =
          Array.isArray(ctx.matched_on) && ctx.matched_on.length > 0
            ? '<p class="meta">Matched on ' + esc(ctx.matched_on.join(', ')) + '</p>'
            : '';
        var ce3 = ctx.ce3_evidence_available;
        var evidenceHtml = ce3
          ? '<button type="button" class="btn btn-ghost" id="unauth-pdf-btn">Get PDF</button>' +
            '<div class="evidence-result" id="unauth-pdf-result" hidden></div>'
          : '';
        var subtitle =
          ctx.state === 'low_clear' || (refunds + chargebacks === 0 && !claims.cross_merchant)
            ? 'Identity confirmed · No prior claims on record'
            : 'Case context at your store';
        root.innerHTML =
          '<div class="card">' +
          '<div class="headline state-heading"><span class="state-dot ' + theme.className + '" aria-hidden="true"></span>' + theme.label + '</div>' +
          '<p class="meta">' + esc(subtitle) + '</p>' +
          matchedHtml +
          storeHtml +
          networkHtml +
          claimsHtml +
          '<div class="actions">' +
          '<button type="button" class="btn btn-primary" id="unauth-profile-btn">View Profile</button>' +
          evidenceHtml +
          '</div></div>';
        bindProfileBtn(profileUrlValue);
        if (ce3) bindPdfBtn(apiKey, email, orderId);
      }

      function fetchHelpdeskContext(email, name, orderId, apiKey) {
        var qs =
          '?email=' +
          encodeURIComponent(email) +
          '&name=' +
          encodeURIComponent(name || '') +
          '&order_ref=' +
          encodeURIComponent(orderId || '');
        return apiFetch('/api/v1/helpdesk-ticket-context' + qs, apiKey).then(function (r) {
          return r.json().then(function (body) {
            return { status: r.status, body: body };
          });
        });
      }

      function bindProfileBtn(profileUrlValue) {
        var btn = document.getElementById('unauth-profile-btn');
        if (btn) {
          btn.addEventListener('click', function () {
            window.open(profileUrlValue, '_blank', 'noopener,noreferrer');
          });
        }
      }

      function bindPdfBtn(apiKey, email, orderId) {
        var btn = document.getElementById('unauth-pdf-btn');
        var resultEl = document.getElementById('unauth-pdf-result');
        if (!btn) return;
        if (!orderId) {
          btn.disabled = true;
          btn.textContent = 'Get PDF (needs order ID)';
          return;
        }
        btn.addEventListener('click', function () {
          btn.disabled = true;
          btn.textContent = 'Generating…';
          fetch(APP_BASE + '/api/v1/evidence', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              Accept: 'application/json',
              Authorization: 'Bearer ' + apiKey,
            },
            body: JSON.stringify({ email: email, order_id: orderId }),
          })
            .then(function (r) {
              return r.json().then(function (b) {
                return { ok: r.ok, body: b };
              });
            })
            .then(function (res) {
              if (!res.ok) {
                btn.disabled = false;
                btn.textContent = 'Get PDF';
                resultEl.hidden = false;
                resultEl.textContent =
                  (res.body && res.body.error) || 'PDF generation failed';
                return;
              }
              var ref = res.body.reference || 'Evidence';
              var evidenceId = res.body.evidence_id || '';
              if (!evidenceId) {
                btn.disabled = false;
                btn.textContent = 'Get PDF';
                resultEl.hidden = false;
                resultEl.textContent = 'Evidence generated but download token failed';
                return;
              }
              return fetch(APP_BASE + '/api/v1/evidence/' + encodeURIComponent(evidenceId) + '/signed-url', {
                headers: {
                  Accept: 'application/json',
                  Authorization: 'Bearer ' + apiKey,
                }
              }).then(function (signedRes) {
                return signedRes.json().then(function (signedBody) {
                  if (!signedRes.ok) throw new Error((signedBody && signedBody.error) || 'Could not issue download link');
                  var ref = res.body.reference || 'Evidence';
                  var url = signedBody.download_url || res.body.download_url || res.body.pdf_url || '#';
                  btn.hidden = true;
                  resultEl.hidden = false;
                  resultEl.innerHTML =
                    '<a href="' +
                    esc(url) +
                    '" target="_blank" rel="noopener noreferrer">' +
                    esc(ref) +
                    ' — Download PDF</a>';
                });
              });
            })
            .catch(function () {
              btn.disabled = false;
              btn.textContent = 'Get PDF';
              resultEl.hidden = false;
              resultEl.textContent = 'Could not reach Unauth';
            });
        });
      }

      // Clean customer: identity confirmed (or store-known) with no claims on
      // record. Renders as a calm green confirmation — never a warning.
      function renderClean(profileUrlValue, grade, customer) {
        var theme = gradeTheme(grade || 'definite');
        var bh = (customer && customer.behavioral_history) || {};
        var orders = bh.total_orders != null ? bh.total_orders : '—';
        root.innerHTML =
          '<div class="card">' +
          '<div class="headline state-heading"><span class="state-dot ' + theme.className + '" aria-hidden="true"></span>' + theme.label + '</div>' +
          '<p class="meta">Identity confirmed · No prior claims on record</p>' +
          '<div class="section"><p class="muted">Orders at your store: ' + esc(String(orders)) + '</p></div>' +
          '<div class="actions">' +
          '<button type="button" class="btn btn-primary" id="unauth-profile-btn">View Profile</button>' +
          '</div></div>';
        bindProfileBtn(profileUrlValue);
      }

      // Network/identity match with claim history. Grade is the primary element;
      // a plain, sourced claims record sits beneath it. No risk score/band.
      function renderMatch(profileUrlValue, email, lookup, apiKey, orderId) {
        var theme = gradeTheme(lookup.confidence);
        var claims = lookup.claims_record || {};
        var matchedOn = Array.isArray(lookup.matched_on) ? lookup.matched_on : [];
        var matchedHtml = matchedOn.length > 0
          ? '<p class="meta">Matched on ' + esc(matchedOn.join(', ')) + '</p>'
          : '';
        var cross = claims.cross_merchant;
        var crossHtml = cross
          ? '<div class="section cross"><p class="section-title">Cross-merchant</p><p>' +
            esc(String(cross.merchant_count)) + ' merchants · ' +
            esc(String(cross.claim_count)) + ' claims</p></div>'
          : '';
        var ce3 = lookup.ce3_evidence_available;
        var ce3Html = ce3
          ? '<div class="section"><p class="section-title">CE 3.0</p><p>CE 3.0 evidence available</p></div>'
          : '';
        var evidenceHtml = ce3
          ? '<button type="button" class="btn btn-ghost" id="unauth-pdf-btn">Get PDF</button>' +
            '<div class="evidence-result" id="unauth-pdf-result" hidden></div>'
          : '';
        root.innerHTML =
          '<div class="card">' +
          '<div class="headline state-heading"><span class="state-dot ' + theme.className + '" aria-hidden="true"></span>' + theme.label + '</div>' +
          matchedHtml +
          '<div class="section"><p class="section-title">Claims on record</p><p>' + esc(claimsLine(claims)) + '</p></div>' +
          crossHtml +
          ce3Html +
          '<div class="actions">' +
          '<button type="button" class="btn btn-primary" id="unauth-profile-btn">View Profile</button>' +
          evidenceHtml +
          '</div></div>';
        bindProfileBtn(profileUrlValue);
        if (ce3) bindPdfBtn(apiKey, email, orderId);
      }

      function apiFetch(path, apiKey) {
        return fetch(APP_BASE + path, {
          headers: {
            Accept: 'application/json',
            Authorization: 'Bearer ' + apiKey,
          },
        });
      }

      function fetchCustomer(email, apiKey) {
        return apiFetch(
          '/api/v1/customers?email=' + encodeURIComponent(email),
          apiKey
        ).then(function (r) {
          if (r.status === 404) return null;
          if (!r.ok) throw new Error('Customer lookup failed');
          return r.json();
        });
      }

      function runLookup(email, name, orderId, apiKey) {
        var qs =
          '?email=' +
          encodeURIComponent(email) +
          '&name=' +
          encodeURIComponent(name || '');
        return apiFetch('/api/v1/lookup' + qs, apiKey).then(function (r) {
          return r.json().then(function (body) {
            return { status: r.status, body: body };
          });
        });
      }

      async function init() {
        renderLoading();
        try {
          var client = ZAFClient.init();
          var data = await client.get([
            'ticket.requester.email',
            'ticket.requester.name',
            'ticket.externalId',
          ]);
          var meta = await client.metadata();
          APP_BASE = resolveAppBase(meta.settings);
          var apiKey = (meta.settings && meta.settings.api_key) || '';
          var email = (data['ticket.requester.email'] || '').trim();
          var name = (data['ticket.requester.name'] || '').trim();
          var orderId = (data['ticket.externalId'] || '').trim();

          if (!apiKey) {
            renderError('API key missing. Add your Unauth API key in the Zendesk app install settings (Settings → API & Integrations in Unauth).');
            return;
          }
          if (!email) {
            renderError('This ticket has no requester email.');
            return;
          }

          var contextRes = await fetchHelpdeskContext(email, name, orderId, apiKey);

          if (contextRes.status === 401) {
            renderError('Invalid API key. Check Unauth → Settings → API & Integrations.');
            return;
          }
          if (contextRes.status === 403) {
            renderError(
              contextRes.body.error ||
                'Your plan does not include the helpdesk sidebar. Check Billing in Unauth.'
            );
            return;
          }
          if (contextRes.status === 429) {
            renderError(contextRes.body.error || 'Daily lookup limit reached.');
            return;
          }
          if (contextRes.status >= 500) {
            renderError(contextRes.body.error || 'Server error');
            return;
          }

          if (contextRes.status !== 200) {
            renderError(contextRes.body.error || 'Could not load case context');
            return;
          }

          var ctx = contextRes.body;
          if (ctx.state === 'error') {
            renderError(ctx.message || 'Could not load case context');
            return;
          }
          if (ctx.state === 'not_found') {
            renderNotFound();
            return;
          }

          if (!ctx.profile_url) {
            ctx.profile_url = await fetchProfileUrl(apiKey, email).catch(function () {
              return profileUrl(email);
            });
          }

          renderHelpdeskContext(ctx, apiKey, email, orderId);
        } catch (err) {
          renderError(err && err.message ? err.message : 'Could not load ticket data');
        }
      }

      init();
    })();
  </script>
</body>
</html>
