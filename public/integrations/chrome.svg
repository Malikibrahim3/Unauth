<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="Chrome">
  <!-- White base so anti-aliased edges look clean -->
  <circle cx="16" cy="16" r="16" fill="#fff"/>
  <!-- Red sector: 12 o'clock → 4 o'clock (120°) -->
  <path d="M16 16L16 0A16 16 0 0 1 29.856 24z" fill="#EA4335"/>
  <!-- Yellow sector: 4 o'clock → 8 o'clock (120°) -->
  <path d="M16 16L29.856 24A16 16 0 0 1 2.144 24z" fill="#FBBC05"/>
  <!-- Green sector: 8 o'clock → 12 o'clock (120°) -->
  <path d="M16 16L2.144 24A16 16 0 0 1 16 0z" fill="#34A853"/>
  <!-- White separator ring -->
  <circle cx="16" cy="16" r="10.5" fill="white"/>
  <!-- Blue centre circle -->
  <circle cx="16" cy="16" r="9" fill="#4285F4"/>
</svg>
